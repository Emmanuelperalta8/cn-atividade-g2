version: '3.8'

services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack-restaurante
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,sqs,s3,sns,lambda,apigateway
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - restaurante-network

networks:
  restaurante-network:
    driver: bridge